/opt/uncut/data/logs/nginx/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 nginx root
    sharedscripts
    postrotate
        [ -f /run/nginx.pid ] && kill -USR1 `cat /run/nginx.pid` || true
    endscript
}

# Containers log to open fds (IPs/UUIDs); copytruncate rotates without restart — no bytes lost, no downtime.
/opt/uncut/data/logs/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    copytruncate
    create 0640 root root
}
