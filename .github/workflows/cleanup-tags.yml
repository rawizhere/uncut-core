
name: Cleanup old tags

on:
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove old tags
        run: |
          TAGS=("main" "sha-3e269bc")
          for tag in "${TAGS[@]}"; do
            echo "Removing ghcr.io/rawizhere/uncut-core:$tag"
            skopeo delete "docker://ghcr.io/rawizhere/uncut-core:$tag" || true
          done
