
name: Purge all images except latest

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  purge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove all tags except latest
        run: |
          # Get all tags via skopeo inspect
          TAGS=$(skopeo inspect docker://ghcr.io/rawizhere/uncut-core:latest 2>/dev/null || true)

          # Get package versions via GitHub API - using repo-level endpoint
          echo "Fetching package versions..."
          VERSIONS=$(gh api             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "repos/${{ github.repository }}/packages/container/uncut-core/versions"             --jq "[.[] | {id, name}] | length" 2>/dev/null || echo "0")
          echo "Found $VERSIONS versions"

          # Get all version IDs except latest
          gh api             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "repos/${{ github.repository }}/packages/container/uncut-core/versions"             --jq ".[] | {id, name}" 2>/dev/null | while read -r line; do
            ID=$(echo "$line" | jq -r '.id')
            NAME=$(echo "$line" | jq -r '.name')
            if [ "$NAME" != "latest" ] && [ "$NAME" != "null" ] && [ "$NAME" != "" ]; then
              echo "Deleting version $ID ($NAME)"
              gh api                 -X DELETE                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "repos/${{ github.repository }}/packages/container/uncut-core/versions/$ID"                 || echo "Failed to delete $ID"
            fi
          done

          # Also delete any remaining tags via skopeo
          echo "Cleaning up remaining tags via skopeo..."
          for tag in main sha-3e269bc; do
            skopeo delete "docker://ghcr.io/rawizhere/uncut-core:$tag" 2>/dev/null && echo "Deleted $tag" || echo "Tag $tag already gone"
          done

          echo "Done."
