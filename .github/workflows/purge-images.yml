
name: Purge all images except latest

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge via GitHub Packages API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ github.actor }}"
          PKG="uncut-core"

          # Get all versions with updatedAt, sort by newest first
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/users/$OWNER/packages/container/$PKG/versions?per_page=100" \
            --jq 'sort_by(.updatedAt) | reverse | .[] | "\(.id) \(.name) \(.updatedAt)"' > /tmp/versions.txt

          echo "=== All versions (newest first) ==="
          cat /tmp/versions.txt

          # Keep the single newest version, delete the rest
          KEPT=0
          while read -r id name updated; do
            if [ "$KEPT" -eq 0 ]; then
              echo "Keeping newest version: $id ($name)"
              KEPT=1
              continue
            fi
            [ -z "$id" ] && continue
            
            echo "Deleting $id ($name)..."
            RESPONSE=$(gh api \
              -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/users/$OWNER/packages/container/$PKG/versions/$id" 2>&1) || true
            
            if [ -z "$RESPONSE" ]; then
              echo "  Deleted"
            else
              echo "  Response: $(echo "$RESPONSE" | head -1)"
            fi
          done < /tmp/versions.txt

          echo ""
          echo "=== Remaining ==="
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/users/$OWNER/packages/container/$PKG/versions?per_page=100" \
            --jq '.[] | "\(.id) \(.name)"'
