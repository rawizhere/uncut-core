
name: Purge all images except latest

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove all tags except latest
        run: |
          REPO="ghcr.io/rawizhere/uncut-core"

          # Get all tags via skopeo inspect on latest (returns tags in manifest list)
          # Instead, use crane or skopeo to list
          ALL_TAGS=$(skopeo inspect docker://$REPO:latest | jq -r '.Tags[]' 2>/dev/null || true)

          # If skopeo inspect doesn't return tags, use registry API
          if [ -z "$ALL_TAGS" ]; then
            TOKEN=$(curl -s "https://ghcr.io/token?service=ghcr.io&scope=repository:rawizhere/uncut-core:pull,push,delete" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" | jq -r '.token')
            ALL_TAGS=$(curl -s "https://ghcr.io/v2/rawizhere/uncut-core/tags/list" \
              -H "Authorization: Bearer $TOKEN" | jq -r '.tags[]')
          fi

          echo "=== Tags ==="
          echo "$ALL_TAGS"

          for tag in $ALL_TAGS; do
            [ "$tag" = "latest" ] && continue
            echo ""
            echo "--- Tag: $tag ---"

            # Get digest via skopeo inspect
            INSPECT=$(skopeo inspect docker://$REPO:$tag 2>&1)
            echo "skopeo inspect output:"
            echo "$INSPECT" | head -5
            
            DIGEST=$(echo "$INSPECT" | jq -r '.Digest // empty' 2>/dev/null)
            echo "Digest from inspect: $DIGEST"

            if [ -n "$DIGEST" ]; then
              # Delete using crane or skopeo
              echo "Deleting via skopeo..."
              skopeo delete "docker://$REPO:$tag" 2>&1 || echo "skopeo delete failed"
            else
              echo "Trying skopeo delete without digest..."
              skopeo delete "docker://$REPO:$tag" 2>&1 || echo "skopeo delete failed"
            fi
          done

          echo ""
          echo "=== Done ==="
