
name: Purge all images except latest

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge via GitHub Packages API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ github.actor }}"
          PKG="uncut-core"

          # Get all versions
          echo "Fetching versions..."
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/users/$OWNER/packages/container/$PKG/versions" \
            --jq '.[] | "\(.id) \(.name)"' > /tmp/versions.txt || {
              echo "User-level API failed, trying org-level..."
              gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/orgs/$OWNER/packages/container/$PKG/versions" \
                --jq '.[] | "\(.id) \(.name)"' > /tmp/versions.txt
            }

          echo "All versions:"
          cat /tmp/versions.txt

          # Delete all except latest
          while read -r id name; do
            [ "$name" = "latest" ] && continue
            [ -z "$id" ] && continue
            
            echo "Deleting version $id ($name)..."
            STATUS=$(gh api \
              -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/users/$OWNER/packages/container/$PKG/versions/$id" \
              -o /dev/null -w "%{http_code}" 2>/dev/null || echo "000")
            
            echo "  HTTP $STATUS"
          done < /tmp/versions.txt

          echo ""
          echo "=== Remaining versions ==="
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/users/$OWNER/packages/container/$PKG/versions" \
            --jq '.[] | "\(.id) \(.name)"'
