
name: Purge all images except latest

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Remove all tags except latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          
          # Get registry token with write scope
          TOKEN=$(curl -s "https://ghcr.io/token?service=ghcr.io&scope=repository:rawizhere/uncut-core:pull,push,delete"             -H "Authorization: Bearer $GITHUB_TOKEN" | jq -r '.token')

          # Get all tags
          TAGS=$(curl -s "https://ghcr.io/v2/rawizhere/uncut-core/tags/list"             -H "Authorization: Bearer $TOKEN" | jq -r '.tags[]')

          echo "All tags:"
          echo "$TAGS"

          # Get latest digest
          LATEST_DIGEST=$(curl -s -I "https://ghcr.io/v2/rawizhere/uncut-core/manifests/latest"             -H "Authorization: Bearer $TOKEN"             -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json"             2>/dev/null | grep -i docker-content-digest | tr -d '\r' | awk '{print $2}')

          echo "Latest digest: $LATEST_DIGEST"

          # For each tag that is NOT latest, get its digest and if different, delete it
          for tag in $TAGS; do
            [ "$tag" = "latest" ] && continue
            
            echo "Processing tag: $tag"
            DIGEST=$(curl -s -I "https://ghcr.io/v2/rawizhere/uncut-core/manifests/$tag"               -H "Authorization: Bearer $TOKEN"               -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json"               2>/dev/null | grep -i docker-content-digest | tr -d '\r' | awk '{print $2}')
            
            echo "  Digest: $DIGEST"

            # Delete the manifest
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE               "https://ghcr.io/v2/rawizhere/uncut-core/manifests/$DIGEST"               -H "Authorization: Bearer $TOKEN"               -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json")
            
            echo "  DELETE $tag ($DIGEST): HTTP $HTTP_CODE"
          done

          echo "Done. Only latest remains."
