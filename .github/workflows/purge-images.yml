
name: Purge all images except latest

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge via GitHub Packages API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ github.actor }}"
          PKG="uncut-core"

          # Get all version IDs and names
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/users/$OWNER/packages/container/$PKG/versions" \
            --jq '.[] | "\(.id) \(.name)"' > /tmp/versions.txt

          echo "=== All versions ==="
          cat /tmp/versions.txt
          echo ""

          # Find latest version ID
          LATEST_ID=$(grep " latest$" /tmp/versions.txt | awk '{print $1}')
          echo "Latest version ID: $LATEST_ID"
          echo ""

          # Delete all except latest
          while read -r id name; do
            [ "$id" = "$LATEST_ID" ] && continue
            [ -z "$id" ] && continue
            
            echo "Deleting version $id ($name)..."
            RESPONSE=$(gh api \
              -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/users/$OWNER/packages/container/$PKG/versions/$id" 2>&1) || true
            
            if echo "$RESPONSE" | grep -q "204\|deleted"; then
              echo "  Deleted"
            elif [ -z "$RESPONSE" ]; then
              echo "  Deleted (empty response)"
            else
              echo "  Response: $(echo "$RESPONSE" | head -1)"
            fi
          done < /tmp/versions.txt

          echo ""
          echo "=== Remaining versions ==="
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/users/$OWNER/packages/container/$PKG/versions" \
            --jq '.[] | "\(.id) \(.name)"'
