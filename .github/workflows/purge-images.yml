
name: Purge all images except latest

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove all tags except latest
        run: |
          REPO="ghcr.io/rawizhere/uncut-core"
          
          # Get registry token
          TOKEN=$(curl -s "https://ghcr.io/token?service=ghcr.io&scope=repository:rawizhere/uncut-core:pull,push,delete" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" | jq -r '.token')

          # Get all tags
          ALL_TAGS=$(curl -s "https://ghcr.io/v2/rawizhere/uncut-core/tags/list" \
            -H "Authorization: Bearer $TOKEN" | jq -r '.tags[]')

          echo "=== Tags ==="
          echo "$ALL_TAGS"
          echo ""

          for tag in $ALL_TAGS; do
            [ "$tag" = "latest" ] && continue
            echo "--- $tag ---"

            # Get manifest via GET to obtain Docker-Content-Digest header
            HEADERS=$(curl -s -D /tmp/headers -o /tmp/body "https://ghcr.io/v2/rawizhere/uncut-core/manifests/$tag" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
              -H "Accept: application/vnd.oci.image.index.v1+json" \
              -H "Accept: application/vnd.docker.distribution.manifest.v2+json")

            DIGEST=$(grep -i "Docker-Content-Digest" /tmp/headers | tr -d '\r' | awk '{print $2}')
            
            if [ -n "$DIGEST" ]; then
              echo "  Digest: $DIGEST"
              
              # Delete manifest by digest
              HTTP_CODE=$(curl -s -o /tmp/del -w "%{http_code}" -X DELETE \
                "https://ghcr.io/v2/rawizhere/uncut-core/manifests/$DIGEST" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json")
              
              echo "  DELETE: HTTP $HTTP_CODE"
              if [ "$HTTP_CODE" = "202" ]; then
                echo "  Deleted!"
              else
                cat /tmp/del
              fi
            else
              echo "  No digest found in headers:"
              cat /tmp/headers
            fi
          done

          echo ""
          echo "=== Remaining ==="
          curl -s "https://ghcr.io/v2/rawizhere/uncut-core/tags/list" \
            -H "Authorization: Bearer $TOKEN" | jq -r '.tags[]'
